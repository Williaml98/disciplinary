spring:
  application:
    name: caseflow-be
  datasource:
    url: jdbc:h2:mem:caseflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB

caseflow:
  mail:
    from: noreply@auca.ac.rw
  uploads:
    dir: build/test-uploads

server:
  error:
    include-message: always
