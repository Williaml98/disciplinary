spring:
  application:
    name: caseflow-be
  datasource:
    url: jdbc:h2:mem:caseflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: localhost
    port: 1025
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB

caseflow:
  app-url: http://localhost:5173
  mail:
    from: noreply@auca.ac.rw
  uploads:
    dir: build/test-uploads
  jwt:
    secret: test-only-jwt-signing-secret-not-used-outside-of-tests-at-all
    expiration-minutes: 720
    remember-expiration-minutes: 43200

server:
  error:
    include-message: always
