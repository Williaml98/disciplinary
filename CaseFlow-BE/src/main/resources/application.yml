spring:
  application:
    name: caseflow-be
  datasource:
    url: jdbc:postgresql://localhost:5434/CaseFlowDB
    driver-class-name: org.postgresql.Driver
    username: caseflow
    password: caseflow
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # DisciplinaryCase eagerly loads notes, auditTrail and evidenceFiles (see the comment on those
        # fields). Without batching that costs 3 extra selects per case on every list query; with it,
        # each collection role is loaded for the whole page in one IN-clause round trip. Keep this at or
        # above spring.data.web.pageable.max-page-size or paged reads fall back to per-row selects.
        default_batch_fetch_size: 100
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB

caseflow:
  # Where the frontend is reachable. Used only to build the call-to-action links in outgoing emails,
  # so point it at the deployed frontend origin (not the API) in anything beyond local dev.
  app-url: ${CASEFLOW_APP_URL:http://localhost:5173}
  mail:
    from: ${SMTP_FROM:noreply@auca.ac.rw}
  uploads:
    dir: ${CASEFLOW_UPLOADS_DIR:uploads}
  jwt:
    # Dev-only default so the app works with zero setup, same pattern as SMTP below.
    # Override via JWT_SECRET in .env for anything beyond local dev — never commit a real one.
    secret: ${JWT_SECRET:xHrCyULFQfVaEz_j1SNuDOK3JQBnkRe3hguSnrNbKBm7_NKEYCg39SaCqrd3JDmy}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
    remember-expiration-minutes: ${JWT_REMEMBER_EXPIRATION_MINUTES:43200}

server:
  port: 8080
  error:
    include-message: always
