spring:
  application:
    name: caseflow-be
  datasource:
    url: jdbc:postgresql://localhost:5434/CaseFlowDB
    driver-class-name: org.postgresql.Driver
    username: caseflow
    password: caseflow
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

caseflow:
  mail:
    from: ${SMTP_FROM:noreply@auca.ac.rw}

server:
  port: 8080
  error:
    include-message: always
